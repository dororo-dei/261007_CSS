<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가상 요소</title>
    <!-- 폰트어썸 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="pesudo_element.css" />
  </head>
  <body>
    <!-- 가상 ::before ::after -->
    <!-- ::before 내용의 앞앞-->
    <p>김도원</p>
    <h1>김도원</h1>
    <!-- html code 복사하고 cdn복사해서 헤드에 넣기 -->
    <i class="fa-solid fa-house-chimney"></i>
    <h2>김도원</h2>
    <i
      class="fa-solid fa-house-chimney fa-beat"
      style="color: rgb(177, 151, 252)"
    ></i>
    <!-- fa-house가 아래 클래스의 메인 이름 -->
    <i
      class="fa-solid fa-house-chimney fa-shake"
      style="color: rgb(177, 151, 252)"
    ></i>
  </body>
</html>
