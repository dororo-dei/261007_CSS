<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변형</title>
    <link rel="stylesheet" href="transform.css" />
  </head>
  <body>
    <!-- 이동 변형 -->
    <div class="container">
      <!-- x 방향으로 이동 -->
      <div class="origin">
        <div class="movex"></div>
      </div>
      <!-- y 방향으로 이동 -->
      <div class="origin">
        <div class="movey"></div>
      </div>
      <!-- xy 방향으로 이동 -->
      <div class="origin">
        <div class="movexy"></div>
      </div>
    </div>
    <!-- 확대 축소 변형 -->
    <div class="container">
      <!-- x 방향으로 이동 -->
      <div class="origin">
        <div class="scaleX"></div>
      </div>
      <!-- y 방향으로 이동 -->
      <div class="origin">
        <div class="scaleY"></div>
      </div>
      <!-- xy 방향으로 이동 -->
      <div class="origin">
        <div class="scale"></div>
      </div>
    </div>
    <!-- 회전 변형 -->
    <div class="container">
      <div class="origin" id="rotate1">
        <img src="img/tree.jpg" alt="나무" />
      </div>
      <div class="origin" id="rotate2">
        <img src="img/tree.jpg" alt="나무" />
      </div>
    </div>
    <!-- 3d 회전 변형 -->
    <div class="container">
      <div class="origin" id="rotate3">
        <img src="img/tree.jpg" alt="나무" />
      </div>
      <div class="origin" id="rotate4">
        <img src="img/tree.jpg" alt="나무" />
      </div>
    </div>
    <!-- 비틀기 변형 -->
    <div class="container">
      <!-- x 방향으로 이동 -->
      <div class="origin">
        <div class="skewX"></div>
      </div>
      <!-- y 방향으로 이동 -->
      <div class="origin">
        <div class="skewY"></div>
      </div>
      <!-- xy 방향으로 이동 -->
      <div class="origin">
        <div class="skewXY"></div>
      </div>
    </div>
  </body>
</html>
